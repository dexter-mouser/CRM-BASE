<template id="cuadricula-estructura">
<div class="cuadricula-datos" role="grid" aria-label="{{titulo}}">
  <div class="fila-cuadricula encabezado-cuadricula" role="row">{{{encabezados}}}</div>
  <div class="fila-cuadricula fila-busqueda" role="row">{{{filtros}}}</div>
  <div class="cuerpo-cuadricula"></div>
</div>
<div class="pie-cuadricula texto-suave">
  <span class="resumen-cuadricula" role="status"></span>
  <button type="button" class="boton-enlace ver-mas-cuadricula" hidden>Ver más</button>
  <span class="acciones-csv">
    <button type="button" class="boton-enlace plantilla-cuadricula" hidden title="Descarga el formato para importar">Plantilla CSV</button>
    <label class="boton-enlace importar-cuadricula" hidden>Importar CSV<input type="file" accept=".csv,text/csv" hidden></label>
    <button type="button" class="boton-enlace exportar-cuadricula" hidden>Exportar CSV</button>
  </span>
</div>
</template>

<template id="cuadricula-vacio">
  <div class="vacio-cuadricula texto-suave">{{texto}}</div>
</template>

<template id="cuadricula-encabezado">
  <div role="columnheader" class="{{clase}}">{{titulo}}</div>
</template>

<template id="cuadricula-filtro">
  <div role="gridcell"><input class="campo" data-columna="{{clave}}" aria-label="Buscar por {{titulo}}" placeholder="Buscar" autocomplete="off"></div>
</template>

<template id="cuadricula-filtro-vacio">
  <div role="gridcell"></div>
</template>

<template id="cuadricula-fila">
  <div class="fila-cuadricula fila-dato" role="row">{{{celdas}}}</div>
</template>

<template id="cuadricula-celda">
  <div role="gridcell" class="{{clase}}">{{texto}}</div>
</template>

<template id="cuadricula-celda-html">
  <div role="gridcell" class="{{clase}}">{{{contenido}}}</div>
</template>
